{% extends "base.html" %}
{% block title %}Sign up / Quorum{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="page-head">
    <p class="kicker">Create account</p>
    <h1>Sign up</h1>
  </div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="auth-form" action="/signup" method="post">
    <label>Name<input name="name" value="{{ form.name or '' }}" autocomplete="name" required></label>
    <label>Email<input name="email" type="email" value="{{ form.email or '' }}" autocomplete="email" required></label>
    <label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Role
      <select name="role" required>
        <option value="student" {% if form.role != "faculty" %}selected{% endif %}>Student</option>
        <option value="faculty" {% if form.role == "faculty" %}selected{% endif %}>Faculty</option>
      </select>
    </label>
    <button type="submit">Sign up</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="/login">Log in</a>.</p>
</section>
{% endblock %}
