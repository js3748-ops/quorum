<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up / Quorum</title><link rel="stylesheet" href="styles.css"><script src="js/api.js" defer></script><script src="js/app.js" defer></script></head><body data-page="signup"><header class="topbar" id="topbar"></header><main><div id="messages"></div><section class="auth-page"><div class="page-head"><p class="kicker">Create account</p><h1>Sign up</h1></div><form class="auth-form" id="signup-form"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Role<select name="role" required><option value="student">Student</option><option value="faculty">Faculty</option></select></label><button type="submit">Sign up</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a>.</p></section></main></body></html>
